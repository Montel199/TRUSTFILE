<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustFile – Secure File Check</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Optional: add Font Awesome for icons later -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> -->
</head>

<body class="upload-page">

    <div class="container">

        <div class="upload-preview info-box" style="display:none;">
    <img src="" alt="File Preview" class="file-thumbnail" id="filePreview">
    <p><span class="report-label">Selected File:</span> <span class="report-value" id="fileName"></span></p>
    <p><span class="report-label">Size:</span> <span class="report-value" id="fileSize"></span></p>
</div>

        <h2>TrustFile</h2>
        <p class="subtitle">Verify your files — fast, secure, private</p>

        <form method="POST" enctype="multipart/form-data" id="upload-form">
            <!-- Drag & drop friendly area -->
            <div class="upload-area" id="drop-zone">
                <div class="upload-prompt">
                    <i class="upload-icon">📤</i> <!-- You can replace with Font Awesome later -->
                    <p>Drag & drop your file here</p>
                    <p>or</p>
                    <label for="file-input" class="browse-btn">Browse files</label>
                </div>
                <input type="file" id="file-input" name="file" required hidden>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Analyze File</button>
                <!-- You can enable this later or remove it -->
                <!-- <button type="button" class="btn-secondary">Clear</button> -->
            </div>
        </form>

        <footer class="small-footer">
            Powered by cryptographic hashing & smart analysis • Local processing
        </footer>
    </div>

    <script>
const fileInput = document.querySelector('input[type="file"]');
const previewBox = document.querySelector('.upload-preview');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const filePreview = document.getElementById('filePreview');

fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) {
        previewBox.style.display = 'none';
        return;
    }
    
    fileName.textContent = file.name;
    fileSize.textContent = (file.size / 1024).toFixed(2) + ' KB';
    
    // For images only
    if(file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = e => filePreview.src = e.target.result;
        reader.readAsDataURL(file);
        filePreview.style.display = 'block';
    } else {
        filePreview.style.display = 'none';
    }

    previewBox.style.display = 'block';
});
</script>

</body>
</html>
